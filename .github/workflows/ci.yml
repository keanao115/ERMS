name: ERMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erms_user
          POSTGRES_PASSWORD: erms_password_2026
          POSTGRES_DB: erms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:shared

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Type Check & Lint
        run: |
          npx tsc --noEmit --project packages/shared/tsconfig.json
          npx tsc --noEmit --project apps/backend/tsconfig.json
          npx tsc --noEmit --project apps/frontend/tsconfig.json

      - name: Build Production Bundles
        run: npm run build
